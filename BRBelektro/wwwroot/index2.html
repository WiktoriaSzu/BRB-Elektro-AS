<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BRB Elektro Admin Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="static/admin.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h1>Admin Login</h1>
            <p>Logg inn for å se kundehenvendelser</p>

            <form>
                <div class="form-group">
                    <label for="email">E-post</label>
                    <input type="email" id="email" name="email" placeholder="Skriv inn e-post">
                </div>

                <div class="form-group">
                    <label for="password">Passord</label>
                    <input type="password" id="password" name="password" placeholder="Skriv inn passord">
                </div>

                <button type="submit" class="admin-btn full-width">Logg inn</button>
                <div class="error-message"> Feil e-post eller passord!</div>
            </form>
        </div>
    </div>
    <script src="static/script2.js"></script>
</body>
</html>
