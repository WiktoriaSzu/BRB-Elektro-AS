<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BRB Elektro Admin Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <div class="page-section"></div>
  <div class="table-container">
    <h2>Customer Inquiries</h2>
    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Epost</th>
            <th>Telefon</th>
            <th>Beskrivelse</th>
            <th>Date</th>
            <th>Status</th>
            <th>Betaling</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="InquiryTable">
        <!-- Data goes here -->
        </tbody>
    </table>
</div>
<div class="table-container form-container">
  <h2>Add Entry</h2>

  <form id="addForm" onsubmit="sendInquiry(event)">
    <div class="form-grid">

      <div class="form-row">
        <label>Name</label>
        <input type="text" id="name" required>
      </div>

      <div class="form-row">
        <label>Epost</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-row">
        <label>Telefon</label>
        <input type="text" id="phone">
      </div>

      <div class="form-row">
        <label>Beskrivelse</label>
        <input type="text" id="description">
      </div>

      <div class="form-row">
        <label>Date</label>
        <input type="date" id="date">
      </div>

      <div class="form-row">
        <label>Status</label>
        <select id="status">
          <option value="Ny">Ny</option>
          <option value="Pågår">Pågår</option>
          <option value="Fullført">Fullført</option>
        </select>
      </div>

      <div class="form-row">
        <label>Betaling</label>
        <select id="payment">
          <option value=false>Ikke betalt</option>
          <option value=true>Betalt</option>
        </select>
      </div>

    </div>

    <div class="form-actions">
      <button type="submit">Add</button>
    </div>
  </form>
</div>
<div class="page-section"></div>
<script src="/static/app.js"></script>
</body>
</body>
</html>
