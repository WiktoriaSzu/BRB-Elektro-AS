<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    const token = sessionStorage.getItem('google_token');
    if (!token) { window.location.href = '/login.html'; }
  </script>
  <title>BRB Elektro Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="static/admin.css">
</head>
<body>
    <main class="admin-page">

      <header class="admin-header">
        <div>
          <h1>Adminpanel</h1>
          <p>Administrer kundehenvendelser for BRB Elektro AS</p>
        </div>
      </header>

    <div class="table-container">
    <h2>Kundehenvendelser</h2>
    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Navn</th>
            <th>Epost</th>
            <th>Telefon</th>
            <th>Beskrivelse</th>
            <th>Date</th>
            <th>Status</th>
            <th>Betaling</th>
            <th>Handlinger</th>
        </tr>
        </thead>
        <tbody id="InquiryTable">
        <!-- Data goes here -->
        </tbody>
    </table>
</div>
<div class="table-container form-container">
  <h2>Legg til henvendelse</h2>

  <form id="addForm" onsubmit="sendInquiry(event)">
    <div class="form-grid">

      <div class="form-row">
        <label>Navn</label>
        <input type="text" id="name" required>
      </div>

      <div class="form-row">
        <label>Epost</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-row">
        <label>Telefon</label>
        <input type="text" id="phone">
      </div>

      <div class="form-row">
        <label>Beskrivelse</label>
        <input type="text" id="description">
      </div>

      <div class="form-row">
        <label>Dato</label>
        <input type="date" id="date">
      </div>

      <div class="form-row">
        <label>Status</label>
        <select id="status">
          <option value="Ny">Ny</option>
          <option value="Pågår">Pågår</option>
          <option value="Fullført">Fullført</option>
        </select>
      </div>

      <div class="form-row">
        <label>Betaling</label>
        <select id="payment">
          <option value=false>Ikke betalt</option>
          <option value=true>Betalt</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit">Legg til</button>
    </div>
  </form>
</div>
<div class="page-section"></div>

<div id="modalOverlay" class="modal-overlay" style="display:none;">
  <div id="editFormContainer" class="table-container form-container modal-box">
    <h2>Edit Inquiry</h2>

    <form id="editForm">
      <input type="hidden" id="editId">

      <div class="form-grid">
        <div class="form-row">
          <label>Navn</label>
          <input type="text" id="editName" required>
        </div>

        <div class="form-row">
          <label>Epost</label>
          <input type="email" id="editEpost">
        </div>

        <div class="form-row">
          <label>Telefon</label>
          <input type="text" id="editTelefon">
        </div>

        <div class="form-row">
          <label>Beskrivelse</label>
          <textarea id="editBeskrivelse" rows="4"></textarea>
        </div>

        <div class="form-row">
          <label>Dato</label>
          <input type="date" id="editDato">
        </div>

        <div class="form-row">
          <label>Status</label>
          <select id="editStatus">
            <option value="Ny">Ny</option>
            <option value="Pågår">Pågår</option>
            <option value="Fullført">Fullført</option>
          </select>
        </div>

        <div class="form-row">
          <label>Betaling</label>
          <select id="editBetaling">
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" onclick="saveEditForm(event)">Save</button>
        <button type="button" onclick="closeEditForm(event)">Cancel</button>
      </div>
    </form>
  </div>
</div>
</main>
<script src="/static/app.js"></script>

</body>
</html>
