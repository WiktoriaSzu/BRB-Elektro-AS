<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BRB Elektro AS</title>
  <link rel="icon" href="../static/img/circle.png">
  <link rel="stylesheet" href="../static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <div id="navbar"></div>
  <section class="contact-wrapper">

    <!-- Left Column (Form) -->
    <div class="contact-left">
      <h2>Kontaktskjema</h2>

      <form onsubmit="sendForm(event)">
        <input type="text" id="name" placeholder="Navn" required>
        <input type="email" id="email" placeholder="Epost addresse" required>
        <input type="tel" id="phone" placeholder="Telefon" pattern="[0-9]{8}">
        <textarea id="message" placeholder="Kort beskrivelse" rows="4" required></textarea>
        <button type="submit">Send</button>
      </form>
    </div>

    <!-- Right Column (Message) -->
    <div class="contact-right">
      <h2>Snakk med oss!</h2>
      <p>
        Vi er her for å hjelpe med alle elektriske prosjekter, 
        installasjoner eller spørsmål du måtte ha. 
        Send oss en melding, så svarer vi så snart som mulig.
      </p>
    </div>
  </section>
  <div id="footer"></div>¨

</html>
